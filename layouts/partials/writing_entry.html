<article class="post-entry writing-entry">
  {{ partial "entry_badge.html" . }}
  <header class="entry-header">
    <h2>{{ .Title }}{{ if .Draft }} <sup class="entry-isdraft">[draft]</sup>{{ end }}</h2>
  </header>
  {{- if not (.Param "hideSummary") }}
  <div class="entry-content">
    <p>{{ .Summary | plainify | htmlUnescape }}{{ if .Truncated }}...{{ end }}</p>
  </div>
  {{- end }}
  {{- if not (.Param "hideMeta") }}
  <footer class="entry-footer">{{ partial "post_meta.html" . }}</footer>
  {{- end }}
  <a class="entry-link" aria-label="Read {{ .Title | plainify }}" href="{{ .Permalink }}"></a>
</article>
